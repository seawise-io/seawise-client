# Synology Container Manager: Project > Create, source "Create docker-compose.yml".
# Set PUID to your DSM user's ID (id -u over SSH); GID 100 is "users".
services:
  seawise:
    image: ghcr.io/seawise-io/seawise-client:beta
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      PUID: "1026"
      PGID: "100"
    ports:
      - "8082:8082"
    volumes:
      - /volume1/docker/seawise:/config
