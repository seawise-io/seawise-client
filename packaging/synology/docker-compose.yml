# Synology Container Manager: Project > Create, source "Create docker-compose.yml".
# Set PUID to your DSM user's ID (id -u over SSH); GID 100 is "users".
services:
  seawise:
    image: ghcr.io/seawise-io/seawise-client:beta
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      PUID: "1026"
      PGID: "100"
    # Anyone on the LAN who reaches this port in the first 5 minutes after
    # start can set the admin password. If the NAS is on other networks too,
    # publish on its LAN IP only, e.g. "192.168.1.10:8082:8082".
    ports:
      - "8082:8082"
    volumes:
      - /volume1/docker/seawise:/config
