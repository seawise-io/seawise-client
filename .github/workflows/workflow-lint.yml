name: Workflow Lint

on:
  pull_request:
    branches: [main, v2, v2-integration]
  push:
    branches: [main, v2, v2-integration]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check action pins and permissions
        run: python3 .github/scripts/check-workflow-pins.py

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
