# Release: runs only on version tag push (v*), tags must be on main.
#
# v1.* tags: build, test and release jobs, which publish :<semver>,
#   :<major>.<minor> and :latest from Dockerfile.
# v2.X.Y[-pre] tags: build-v2 and release-v2, which publish the
#   seawise-agent image (Dockerfile.agent) as :2.X.Y[-pre], :2 and :beta
#   only. The image is pushed by digest, scanned, signed and attested
#   (SBOM, SLSA provenance) before any tag points at it. :stable moves only
#   through promote-stable.yml.
# Any other v* tag fails in classify.
# All 3rd-party actions pinned to exact commit SHAs.

name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: seawise-io/seawise-client

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      line: ${{ steps.tag.outputs.line }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      tags: ${{ steps.tag.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Classify tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release-channel.py classify "$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Require tag on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -v ./...

  build:
    needs: [classify, test]
    if: needs.classify.outputs.line == 'v1'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write     # Attach SBOM to GitHub Release
      packages: write
      id-token: write     # Keyless cosign signing via GitHub OIDC
      attestations: write # SBOM attestation upload

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM attestation to image
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true

  build-v2:
    needs: [classify, test]
    if: needs.classify.outputs.line == 'v2'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write     # Keyless cosign signing via GitHub OIDC
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    env:
      VERSION: ${{ needs.classify.outputs.version }}
      TAGS: ${{ needs.classify.outputs.tags }}
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: no tag points at the image until it is
      # scanned, signed and attested.
      - name: Build and push by digest
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes --recursive "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM attestation to image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # BuildKit records SLSA provenance per platform; sign it so it can be
      # checked with cosign verify-attestation.
      - name: Attach SLSA provenance attestations
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' > index.json
          for platform in ${PLATFORMS//,/ }; do
            pdigest=$(jq -r --arg p "$platform" '.manifests[]
              | select((.platform.os + "/" + .platform.architecture
                  + (if .platform.variant then "/" + .platform.variant else "" end)) == $p)
              | .digest' index.json)
            if [ -z "$pdigest" ]; then
              echo "::error::no manifest for $platform"
              exit 1
            fi
            out="provenance-${platform//\//-}.json"
            docker buildx imagetools inspect "$ref" \
              --format "{{ json (index .Provenance \"$platform\").SLSA }}" > "$out"
            if jq -e '.buildDefinition' "$out" > /dev/null; then
              type=slsaprovenance1
            elif jq -e '.buildType' "$out" > /dev/null; then
              type=slsaprovenance02
            else
              echo "::error::no SLSA provenance for $platform"
              exit 1
            fi
            cosign attest --yes --type "$type" --predicate "$out" "${REGISTRY}/${IMAGE_NAME}@${pdigest}"
          done

      - name: Tag image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          for t in $TAGS; do
            case "$t" in
              latest|1|1.*) echo "::error::refusing to tag a v2 image :$t"; exit 1 ;;
            esac
            args+=(-t "${REGISTRY}/${IMAGE_NAME}:${t}")
          done
          docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          echo "Published ${DIGEST} as: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"

  # Never marked as the latest GitHub release: v1 clients read
  # releases/latest for their update notice.
  release-v2:
    needs: [classify, build-v2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.classify.outputs.prerelease == 'true' }}
          make_latest: "false"
          body: |
            Client v2 image `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-v2.outputs.digest }}`, published as `:${{ needs.classify.outputs.version }}`, `:2` and `:beta`.

            Verify:
            ```
            cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-v2.outputs.digest }} \
              --certificate-identity https://github.com/seawise-io/seawise-client/.github/workflows/release.yml@${{ github.ref }} \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
