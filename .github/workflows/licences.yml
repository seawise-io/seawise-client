name: Licences

on:
  push:
    branches: [main, v2]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/licences.json"
      - ".github/scripts/check-licences.py"
      - ".github/workflows/licences.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/licences.json"
      - ".github/scripts/check-licences.py"
      - ".github/workflows/licences.yml"

permissions: {}

jobs:
  licences:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_licences.py'

      - name: Check dependency licences
        run: |
          go mod download
          go list -deps -test -f '{{with .Module}}{{if not .Main}}{"Path":"{{.Path}}","Version":"{{.Version}}","Dir":"{{.Dir}}"}{{end}}{{end}}' ./... \
            | sort -u | python3 .github/scripts/check-licences.py
