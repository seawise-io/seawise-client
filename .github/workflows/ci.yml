# CI: tests only, no image push. Go runs in the toolchain image pinned in
# the Makefile, the same one used locally. Actions pinned to commit SHAs.

name: CI

on:
  push:
    branches:
      - main
      - v2
      - v2-integration
  pull_request:
    branches:
      - main
      - v2
      - v2-integration

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Run tests with race detector
        run: make race
